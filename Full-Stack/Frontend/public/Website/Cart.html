<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Page</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="Components/header.css" />
    <link rel="stylesheet" href="Components/Footer.css" />
    <link rel="stylesheet" href="/Website/CSS/Cart.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body>
    <div id="header"></div>

    <main>
      <section class="cartPage">
        <div class="container">
          <h2>Your Cart</h2>

          <div id="cartEmpty" style="display:none; text-align:center; padding:60px 0;">
            <i class="fa-solid fa-bag-shopping" style="font-size:60px; color:#6d4aae; opacity:0.3;"></i>
            <p style="font-size:20px; margin-top:16px; color:#888;">Your cart is empty!</p>
            <a href="/Website/index.html" style="display:inline-block; margin-top:20px; background:#6d4aae; color:#fff; padding:12px 30px; border-radius:30px; font-weight:700; text-decoration:none;">Continue Shopping</a>
          </div>

          <!-- Cart content -->
          <div id="cartBox">
            <p>There are <span class="text-red" id="cartItemCount">0</span> products in your cart</p>

            <div class="cart-wrapper">
              <div class="cart-left">
                <table>
                  <thead>
                    <tr>
                      <th>Products</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Subtotal</th>
                      <th>Remove</th>
                    </tr>
                  </thead>
                  <tbody id="cartTableBody">
                  </tbody>
                </table>
              </div>

              <div class="cart-right">
                <div class="cartDetails">
                  <h4>CART TOTALS</h4>
                  <div class="cart-row"><span>Subtotal</span><span>₹0</span></div>
                  <div class="cart-row"><span>GST (12%)</span><span>₹0</span></div>
                  <div class="cart-row"><span>Delivery Charge</span><span>₹0</span></div>
                  <div class="cart-row total"><span>Total</span><span>₹0</span></div>
                  <button class="checkout-btn" onclick="goToCheckout()">
                    <i class="fas fa-shopping-bag"></i> Checkout
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="/Website/JS/auth.js"></script>
    <script src="/Website/JS/cart.js"></script>

    <script>
      fetch('Components/Header.html')
        .then((res) => res.text())
        .then((data) => {
          document.getElementById('header').innerHTML = data;
          if (typeof updateHeaderUI === 'function') {
            updateHeaderUI();
          }
          if (typeof updateCartCount === 'function') {
            updateCartCount();
          }
          initStickyNav();

          var wrapper = document.querySelector('.headerWrapperFixed');
          window.addEventListener(
            'scroll',
            function () {
              if (window.scrollY > 10) {
                wrapper.classList.add('fixed');
              } else {
                wrapper.classList.remove('fixed');
              }
            },
            { passive: true },
          );
        });

      fetch('Components/Footer.html')
        .then(function(r){ return r.text(); })
        .then(function(d){ document.getElementById('footer').innerHTML = d; });

      renderCartPage();
    </script>
    <script src="JS/stickyNav.js"></script>
  </body>
</html>
