<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="Components/header.css" />
    <link rel="stylesheet" href="Components/Footer.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Lato', sans-serif;
        background: #f5f5f5;
      }

      .profileHero {
        background: linear-gradient(135deg, #6d4aae 0%, #5a3a9a 100%);
        color: white;
        padding: 40px 20px;
        text-align: center;
      }
      .avatarCircle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        margin: 0 auto 16px auto;
        border: 3px solid rgba(255, 255, 255, 0.5);
      }
      .adminBadge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 12px;
        border-radius: 20px;
        margin-top: 6px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .profileHero h2 {
        font-size: 26px;
        font-weight: 900;
        margin-bottom: 4px;
      }
      .profileHero p {
        font-size: 15px;
        opacity: 0.85;
      }

      .profileContainer {
        max-width: 700px;
        margin: 36px auto;
        padding: 0 16px;
      }

      .profileCard {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 28px;
        margin-bottom: 20px;
      }
      .profileCard h3 {
        font-size: 18px;
        font-weight: 800;
        color: #333;
        border-bottom: 3px solid #6d4aae;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      .infoRow {
        display: flex;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid #f0f0f0;
        gap: 14px;
      }
      .infoRow:last-child {
        border-bottom: none;
      }
      .infoRow .icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #f4f0fc;
        color: #6d4aae;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
      }
      .infoRow .label {
        font-size: 12px;
        color: #999;
        margin-bottom: 2px;
      }
      .infoRow .value {
        font-size: 15px;
        color: #333;
        font-weight: 700;
      }

      .quickLinks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .quickLink {
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition:
          box-shadow 0.2s,
          transform 0.2s;
        border: 2px solid transparent;
      }
      .quickLink:hover {
        box-shadow: 0 4px 18px rgba(109, 74, 174, 0.15);
        border-color: #6d4aae;
        transform: translateY(-2px);
      }
      .quickLink .ql-icon {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .quickLink .ql-title {
        font-size: 14px;
        font-weight: 800;
        color: #333;
      }
      .quickLink .ql-sub {
        font-size: 12px;
        color: #999;
        margin-top: 2px;
      }

      /* Admin Users Table */
      .adminCard {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 28px;
        margin-bottom: 20px;
        border-top: 4px solid #6d4aae;
      }
      .adminCard h3 {
        font-size: 18px;
        font-weight: 800;
        color: #333;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .adminCard h3 span.badge-admin {
        background: #6d4aae;
        color: #fff;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .usersTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .usersTable thead tr {
        background: #f4f0fc;
      }
      .usersTable thead th {
        text-align: left;
        padding: 10px 12px;
        color: #6d4aae;
        font-weight: 800;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .usersTable tbody tr {
        border-bottom: 1px solid #f5f5f5;
      }
      .usersTable tbody tr:hover {
        background: #faf8ff;
      }
      .usersTable tbody td {
        padding: 12px;
        color: #444;
      }
      .usersTable .pass-hidden {
        color: #999;
        letter-spacing: 3px;
        font-size: 18px;
      }
      .usersTable .role-badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 700;
      }
      .usersTable .role-admin {
        background: #f4f0fc;
        color: #6d4aae;
      }
      .usersTable .role-user {
        background: #f0f8f0;
        color: #27ae60;
      }
      .loadingTxt {
        color: #999;
        font-size: 14px;
        padding: 20px 0;
      }

      .logoutBtn {
        width: 100%;
        background: linear-gradient(135deg, #ea2b0f, #c62309);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        font-family: 'Lato', sans-serif;
        transition: opacity 0.2s;
      }
      .logoutBtn:hover {
        opacity: 0.88;
      }

      .notLoggedIn {
        text-align: center;
        padding: 80px 20px;
      }
      .notLoggedIn i {
        font-size: 60px;
        color: #6d4aae;
        opacity: 0.3;
      }
      .notLoggedIn p {
        font-size: 18px;
        color: #888;
        margin: 16px 0;
      }
      .notLoggedIn a {
        display: inline-block;
        background: #6d4aae;
        color: white;
        padding: 12px 30px;
        border-radius: 30px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <div id="profileContent"></div>
    <div id="footer"></div>

    <script src="/Website/JS/auth.js"></script>
    <script src="/Website/JS/cart.js"></script>

    <script>
      async function renderProfile() {
        const user = await getLoggedInUser(); // from auth.js
        const content = document.getElementById('profileContent');

        // ── Not logged in ──────────────────────────────────────────────
        if (!user) {
          content.innerHTML =
            '<div class="notLoggedIn">' +
            '<i class="fa-solid fa-user-slash"></i>' +
            '<p>You are not logged in!</p>' +
            '<a href="/Website/SignIn.html">Sign In</a>' +
            '</div>';
          return;
        }

        // ── User data ──────────────────────────────────────────────────
        const name = user.name || 'User';
        const email = user.email || '-';
        const phone = user.phone || '-';
        const isAdmin = user.isAdmin === true;
        const initials = name.charAt(0).toUpperCase();

        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const orders = JSON.parse(localStorage.getItem('orderHistory') || '[]');

        // ── Render hero + info ─────────────────────────────────────────
        content.innerHTML =
          '<div class="profileHero">' +
          '<div class="avatarCircle">' +
          initials +
          '</div>' +
          '<h2>' +
          name +
          '</h2>' +
          '<p>Welcome to your account 👋</p>' +
          (isAdmin
            ? '<div class="adminBadge"><i class="fa-solid fa-shield-halved" style="margin-right:5px"></i>Admin</div>'
            : '') +
          '</div>' +
          '<div class="profileContainer">' +
          '<div class="profileCard">' +
          '<h3><i class="fa-solid fa-user" style="margin-right:8px;color:#6d4aae"></i>Personal Info</h3>' +
          '<div class="infoRow"><div class="icon"><i class="fa-solid fa-user"></i></div><div><div class="label">Full Name</div><div class="value">' +
          name +
          '</div></div></div>' +
          '<div class="infoRow"><div class="icon"><i class="fa-solid fa-envelope"></i></div><div><div class="label">Email</div><div class="value">' +
          email +
          '</div></div></div>' +
          '<div class="infoRow"><div class="icon"><i class="fa-solid fa-phone"></i></div><div><div class="label">Phone</div><div class="value">' +
          phone +
          '</div></div></div>' +
          '</div>' +
          '<div class="quickLinks">' +
          '<a href="/Website/Cart.html" class="quickLink">' +
          '<div class="ql-icon" style="background:#fff1ee;color:#ea2b0f"><i class="fa-solid fa-bag-shopping"></i></div>' +
          '<div><div class="ql-title">My Cart</div><div class="ql-sub">' +
          cart.length +
          ' item(s)</div></div>' +
          '</a>' +
          '<a href="/Website/OrderHistory.html" class="quickLink">' +
          '<div class="ql-icon" style="background:#f4f0fc;color:#6d4aae"><i class="fa-solid fa-clock-rotate-left"></i></div>' +
          '<div><div class="ql-title">Order History</div><div class="ql-sub">' +
          orders.length +
          ' order(s)</div></div>' +
          '</a>' +
          '<a href="/Website/Category.html" class="quickLink">' +
          '<div class="ql-icon" style="background:#e8f8f0;color:#27ae60"><i class="fa-solid fa-grip"></i></div>' +
          '<div><div class="ql-title">Categories</div><div class="ql-sub">Browse products</div></div>' +
          '</a>' +
          '<a href="/Website/ContactUs.html" class="quickLink">' +
          '<div class="ql-icon" style="background:#fef9e7;color:#f39c12"><i class="fa-solid fa-headset"></i></div>' +
          '<div><div class="ql-title">Support</div><div class="ql-sub">Contact us</div></div>' +
          '</a>' +
          '</div>' +
          // Admin Users Table — only if isAdmin
          (isAdmin
            ? '<div class="adminCard" id="adminSection">' +
              '<h3><i class="fa-solid fa-users-gear"></i> Registered Users <span class="badge-admin">ADMIN</span></h3>' +
              '<p class="loadingTxt" id="adminLoadingTxt">Loading users...</p>' +
              '<table class="usersTable" id="usersTable" style="display:none">' +
              '<thead><tr>' +
              '<th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Password</th><th>Role</th>' +
              '</tr></thead>' +
              '<tbody id="usersTableBody"></tbody>' +
              '</table>' +
              '</div>'
            : '') +
          '<div class="profileCard" style="margin-top:20px;">' +
          '<button class="logoutBtn" onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="margin-right:8px;"></i>Logout</button>' +
          '</div>' +
          '</div>';

        // ── Load admin users table ─────────────────────────────────────
        if (isAdmin) {
          loadAllUsers();
        }
      }

      async function loadAllUsers() {
        const API_URL =
          window.location.hostname === 'localhost'
            ? 'http://localhost:8080'
            : 'https://model-1-775m.onrender.com';

        try {
          const res = await fetch(`${API_URL}/api/users/all`);
          const data = await res.json();

          const loadingTxt = document.getElementById('adminLoadingTxt');
          const table = document.getElementById('usersTable');
          const tbody = document.getElementById('usersTableBody');

          if (!data.success || !data.users.length) {
            loadingTxt.textContent = 'No users found.';
            return;
          }

          tbody.innerHTML = data.users
            .map(function (u, i) {
              return (
                '<tr>' +
                '<td>' +
                (i + 1) +
                '</td>' +
                '<td><b>' +
                (u.name || '-') +
                '</b></td>' +
                '<td>' +
                (u.email || '-') +
                '</td>' +
                '<td>' +
                (u.phone || '-') +
                '</td>' +
                '<td class="pass-hidden">••••••••</td>' +
                '<td><span class="role-badge ' +
                (u.isAdmin ? 'role-admin' : 'role-user') +
                '">' +
                (u.isAdmin ? '🛡 Admin' : '👤 User') +
                '</span></td>' +
                '</tr>'
              );
            })
            .join('');

          loadingTxt.style.display = 'none';
          table.style.display = 'table';
        } catch (err) {
          document.getElementById('adminLoadingTxt').textContent =
            'Failed to load users.';
          console.error(err);
        }
      }

      // ── Load header & footer ───────────────────────────────────────────
      fetch('Components/Header.html')
        .then(function (res) {
          return res.text();
        })
        .then(function (data) {
          document.getElementById('header').innerHTML = data;

          updateHeaderUI();

          if (typeof updateCartCount === 'function') {
            updateCartCount();
          }

          initStickyNav();
        });

      fetch('Components/Footer.html')
        .then(function (r) {
          return r.text();
        })
        .then(function (d) {
          document.getElementById('footer').innerHTML = d;
        });

      renderProfile();
    </script>

    <script src="JS/stickyNav.js"></script>
  </body>
</html>
