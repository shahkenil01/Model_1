<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>

  <style>

    body{
      background: purple;
      font-family: Arial;
    }

    .login-box{
      width: 300px;
      background: white;
      padding: 20px;
      margin: 155px auto;
      border-radius: 10px;
    }

    h2{
      text-align: center;
    }

    input{
      width: 92%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .signin-btn{
      background: purple;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
    }

    .google-btn{
      width: 100%;
      padding: 10px;
      margin-top: 10px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-weight: bold;
    }

    img{
      width: 20px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <h2>Sign In</h2>

    <form>

      Email <br>
      <input type="email" placeholder="Enter Email" required>

      Password <br>
      <input type="password" placeholder="Enter Password" required>

      <button type="submit" class="signin-btn">
        Sign In
      </button>

      <p>
      Not Registered?
      <a href="SignUp.html">Sign Up</a>
      </p>
    </form>

    <button class="google-btn">
      <img src="Images/Google image.png">
      Sign In with Google
    </button>

  </div>

</body>
</html>
