<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>
  <link rel="stylesheet" href="/Website/CSS/Sign&SignUp.css">
</head>
<body>

  <div class="login-box">
    <h2>Sign In</h2>

    <form id="loginForm" onsubmit="handleSignIn(event)">
      Email <br>
      <input type="email" id="email" placeholder="Enter Email" required>

      Password <br>
      <input type="password" id="password" placeholder="Enter Password" required>

      <button type="submit" class="signin-btn">Sign In</button>

      <p>Not Registered? <a href="SignUp.html">Sign Up</a></p>
    </form>

    <button class="google-btn">
      <img src="Images/Google image.png" alt="Google">
      Sign In with Google
    </button>
  </div>

  <script src="/Website/JS/auth.js"></script>

</body>
</html>
