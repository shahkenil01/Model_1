<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment - Checkout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/Website/Components/header.css" />
    <link rel="stylesheet" href="/Website/Components/Footer.css" />
    <link rel="stylesheet" href="/Website/CSS/Payment.css" />
  </head>
  <body>
    <div id="header"></div>

    <div class="CheckoutHeader">
      <h1>Checkout</h1>
      <p>Complete your payment</p>
    </div>

    <div class="container">
      <div class="payment-wrapper">

        <!-- ORDER SUMMARY — filled from cart localStorage -->
        <div class="payment-section">
          <h2 class="section-title">Order Summary</h2>
          <div id="orderSummaryItems">
            <!-- dynamic rows injected here -->
          </div>
          <div class="order-item">
            <span>Subtotal</span>
            <span id="paySubtotal">₹0</span>
          </div>
          <div class="order-item">
            <span>GST (12%)</span>
            <span id="payGST">₹0</span>
          </div>
          <div class="order-item">
            <span>Delivery Charge</span>
            <span id="payDelivery">₹0</span>
          </div>
          <div class="total-row">
            <span>Total Amount</span>
            <span id="payTotal">₹0</span>
          </div>
        </div>

        <!-- PAYMENT METHOD -->
        <div class="payment-section">
          <h2 class="section-title">Payment Method</h2>

          <div class="payment-methods">
            <div class="payment-option" onclick="selectPayment('card', event)">
              <input type="radio" id="card" name="payment" value="card" />
              <label for="card"><i class="fas fa-credit-card"></i> Credit/Debit Card<span>Visa, Mastercard, RuPay</span></label>
            </div>
            <div class="payment-option" onclick="selectPayment('upi', event)">
              <input type="radio" id="upi" name="payment" value="upi" />
              <label for="upi"><i class="fas fa-mobile-alt"></i> UPI<span>Google Pay, PhonePe, Paytm</span></label>
            </div>
            <div class="payment-option" onclick="selectPayment('bank', event)">
              <input type="radio" id="bank" name="payment" value="bank" />
              <label for="bank"><i class="fas fa-university"></i> Net Banking<span>All major banks</span></label>
            </div>
            <div class="payment-option" onclick="selectPayment('cod', event)">
              <input type="radio" id="cod" name="payment" value="cod" />
              <label for="cod"><i class="fas fa-truck"></i> Cash on Delivery<span>Pay when you receive</span></label>
            </div>
          </div>

          <div id="cardForm" class="form-section">
            <div class="form-group"><label>Card Number</label><input type="text" placeholder="1234 5678 9012 3456" /></div>
            <div class="form-row">
              <div class="form-group"><label>Expiry Date</label><input type="text" placeholder="MM/YY" /></div>
              <div class="form-group"><label>CVV</label><input type="text" placeholder="123" /></div>
            </div>
          </div>

          <div id="upiForm" class="form-section">
            <div class="form-group"><label>UPI ID</label><input type="text" placeholder="yourname@upi" /></div>
          </div>

          <div id="bankForm" class="form-section">
            <div class="form-group">
              <label>Select Bank</label>
              <select><option>-- Select Bank --</option><option>HDFC Bank</option><option>ICICI Bank</option><option>SBI Bank</option><option>Axis Bank</option><option>Kotak Bank</option></select>
            </div>
          </div>

          <div class="button-group">
            <button class="pay-btn" onclick="processPayment()"><i class="fas fa-lock"></i> Pay Now</button>
            <button class="cancel-btn" onclick="goBack()">Cancel</button>
          </div>
        </div>

      </div>
    </div>

    <div id="footer"></div>

    <div class="modal fade" id="successModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4">
          <div style="font-size:56px; margin-bottom:10px;">✅</div>
          <h4 class="fw-bold mb-2">Payment Successful!</h4>
          <p class="text-muted mb-1">Amount: <strong id="modalAmount"></strong></p>
          <p class="text-muted mb-3">Method: <strong id="modalMethod"></strong></p>
          <p class="mb-4">Thank you for your order! 🎉</p>
          <button class="btn btn-success px-4" onclick="orderDone()">View Order History</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Website/JS/auth.js"></script>
    <script src="/Website/JS/cart.js"></script>

    <script>
      var selectedPaymentMethod = null;

      function loadOrderSummary() {
        var cart = getCart();
        var summaryDiv = document.getElementById('orderSummaryItems');
        summaryDiv.innerHTML = '';

        var subtotal = 0;
        if (cart.length === 0) {
          summaryDiv.innerHTML = '<p style="color:#888;">No items in cart.</p>';
        } else {
          for (var i = 0; i < cart.length; i++) {
            var item     = cart[i];
            var itemTotal = item.price * item.qty;
            subtotal     += itemTotal;

            var div = document.createElement('div');
            div.className = 'order-item';
            div.innerHTML =
              '<span>' + item.name + ' (' + item.qty + 'x)</span>' +
              '<span>₹' + itemTotal + '</span>';
            summaryDiv.appendChild(div);
          }
        }

        var gst      = Math.round((subtotal * 12) / 100);
        var delivery = subtotal > 0 ? 45 : 0;
        var total    = subtotal + gst + delivery;

        document.getElementById('paySubtotal').textContent = '₹' + subtotal;
        document.getElementById('payGST').textContent      = '₹' + gst;
        document.getElementById('payDelivery').textContent = '₹' + delivery;
        document.getElementById('payTotal').textContent    = '₹' + total;

        window._finalTotal = total;
      }

      function selectPayment(method, event) {
        selectedPaymentMethod = method;
        document.querySelectorAll('input[name="payment"]').forEach(function(r){ r.checked = false; });
        document.getElementById(method).checked = true;
        document.querySelectorAll('.payment-option').forEach(function(o){ o.classList.remove('selected'); });
        if (event && event.currentTarget) event.currentTarget.classList.add('selected');
        document.querySelectorAll('.form-section').forEach(function(f){ f.classList.remove('active'); });
        if (method === 'card') document.getElementById('cardForm').classList.add('active');
        if (method === 'upi')  document.getElementById('upiForm').classList.add('active');
        if (method === 'bank') document.getElementById('bankForm').classList.add('active');
      }

      // ---- Process payment ----
      function processPayment() {
        if (!selectedPaymentMethod) {
          alert('Please select a payment method');
          return;
        }

        var methods = { card: 'Credit/Debit Card', upi: 'UPI', bank: 'Net Banking', cod: 'Cash on Delivery' };

        document.getElementById('modalAmount').textContent = '₹' + window._finalTotal;
        document.getElementById('modalMethod').textContent = methods[selectedPaymentMethod];

        saveOrderToHistory(methods[selectedPaymentMethod]);

        var modal = new bootstrap.Modal(document.getElementById('successModal'));
        modal.show();
      }

      function saveOrderToHistory(methodLabel) {
        var cart  = getCart();
        var now   = new Date();
        var dateStr = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
        var timeStr = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

        var order = {
          id:      'ORD' + Date.now(),
          date:    dateStr + ' at ' + timeStr,
          items:   cart,
          method:  methodLabel,
          total:   window._finalTotal,
          status:  'Order Placed'
        };

        var history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
        history.unshift(order); // newest first
        localStorage.setItem('orderHistory', JSON.stringify(history));

        // Clear cart after order
        localStorage.removeItem('cart');
      }

      // ---- After clicking OK in modal ----
      function orderDone() {
        window.location.href = '/Website/OrderHistory.html';
      }

      function goBack() {
        window.location.href = 'Cart.html';
      }

      fetch('Components/Header.html')
        .then((res) => res.text())
        .then((data) => {
          document.getElementById('header').innerHTML = data;
          if (typeof updateHeaderUI === 'function') {
            updateHeaderUI();
          }
          if (typeof updateCartCount === 'function') {
            updateCartCount();
          }
          initStickyNav();

          var wrapper = document.querySelector('.headerWrapperFixed');
          window.addEventListener(
            'scroll',
            function () {
              if (window.scrollY > 10) {
                wrapper.classList.add('fixed');
              } else {
                wrapper.classList.remove('fixed');
              }
            },
            { passive: true },
          );
        });

      fetch('Components/Footer.html')
        .then(function(r){ return r.text(); })
        .then(function(d){ document.getElementById('footer').innerHTML = d; });

      loadOrderSummary();
    </script>
    <script src="JS/stickyNav.js"></script>
  </body>
</html>
